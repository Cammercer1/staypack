services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "127.0.0.1:${STAYPACK_DEV_PORT:-3000}:3000"
    env_file:
      - .env.local
    environment:
      APP_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Leave room for browser tests within Docker Desktop's memory allocation.
      NODE_OPTIONS: --max-old-space-size=2048
      # Poll once a second: native file events do not reliably cross macOS mounts.
      WATCHPACK_POLLING: "1000"
      NEXT_PUBLIC_SITE_URL: http://localhost:${STAYPACK_DEV_PORT:-3000}
      NEXT_PUBLIC_REPORTS_URL: http://localhost:${STAYPACK_DEV_PORT:-3000}
      QR_CODE_BASE_URL: http://localhost:${STAYPACK_DEV_PORT:-3000}
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - next_cache:/workspace/.next
      - next_dev_cache:/workspace/.next-local
      - npm_cache:/home/node/.npm
    # Check the listener without repeatedly compiling a page or querying Supabase.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s = require('node:net').connect(3000, '127.0.0.1'); s.on('connect', () => { s.end(); process.exit(0); }); s.on('error', () => process.exit(1));"
      interval: 10s
      timeout: 3s
      start_period: 120s
      retries: 12

volumes:
  node_modules:
  next_cache:
  next_dev_cache:
  npm_cache:
