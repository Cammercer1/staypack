[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Runs after the Next adapter and before edge bundling.
[[plugins]]
  package = "./netlify/plugins/defer-framework-middleware"

# Public reports run on the global edge, without starting the Next.js Node function.
# Never opt these responses into CDN caching: every request must check live access.
[[edge_functions]]
  function = "public-reports"
  path = "/examples/*"

[[edge_functions]]
  function = "public-reports"
  path = "/example/*"

[[edge_functions]]
  function = "public-reports"
  path = "/proposal/*"
  excludedPath = "/proposal/print/*"

[[headers]]
  for = "/_report-viewer/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Managed delivery: hit /api/delivery/cron every 15 minutes (set DELIVERY_CRON_SECRET in Netlify env).
[functions."delivery-cron"]
  schedule = "*/15 * * * *"
  path = "/api/delivery/cron"
