name: StayPack CI
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: node --test scripts/ci/*.test.mjs
  database:
    name: Database checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: staypack_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node scripts/ci/test-database.mjs
  build:
    name: Build and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build isolated UI preview
        run: node scripts/ci/build.mjs
        env:
          CI_BRANCH: ${{ github.ref_name == 'main' && 'ci-main-browser' || github.ref_name }}
          CI_SHA: ${{ github.sha }}
      - run: npx playwright test --config playwright.ci.config.ts
      - name: Build production application and public reports
        if: github.ref == 'refs/heads/main'
        run: node scripts/ci/build.mjs
        env:
          CI_BRANCH: main
          CI_SHA: ${{ github.sha }}
          CI_PRODUCTION_ANON_KEY: ${{ vars.PRODUCTION_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: ci-release/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
